<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR NFT – Van Gogh Journey (Improved)</title>

  <!-- A-Frame 1.4.2 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js NFT for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.3/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
    }

    #start-camera {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 28px;
      font-size: 18px;
      background: #ff3e3e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <!-- START CAMERA BUTTON -->
  <button id="start-camera">Start AR Camera</button>

  <!-- AR SCENE -->
  <a-scene embedded renderer="logarithmicDepthBuffer: true;" vr-mode-ui="enabled: false"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; cameraConfig: { facingMode: 'environment' }">

    <!-- CAMERA -->
    <a-entity camera></a-entity>

    <!-- FIRST NFT MARKER: Van Gogh Portrait -->
    <a-nft id="vangogh-marker" type="nft" url="./nfts/vangogh/vangogh" smooth="true" smoothCount="10"
      smoothTolerance="0.01" smoothThreshold="5">

      <!-- BIGGER + CENTERED MODEL -->
      <a-entity gltf-model="./models/vincent.gltf" position="0 0 0" rotation="0 0 0" scale="2.2 2.2 2.2">
      </a-entity>
    </a-nft>


    <!-- SECOND NFT MARKER: Starry Night -->
    <a-nft id="starry-marker" type="nft" url="./nfts/starrynight/starrynight" smooth="true" smoothCount="10"
      smoothTolerance="0.01" smoothThreshold="5">

      <!-- BIGGER + CENTERED MODEL -->
      <a-entity gltf-model="./models/scene.gltf" position="0 0 0" rotation="0 0 0" scale="3 3 3">
      </a-entity>
    </a-nft>

  </a-scene>

  <script>
    document.getElementById('start-camera').addEventListener('click', () => {
      const scene = document.querySelector('a-scene');

      if (scene.components.arjs) {
        scene.components.arjs.start();
        document.getElementById('start-camera').style.display = 'none';
      } else {
        alert("AR.js not ready yet. Please wait 1–2 seconds.");
      }
    });
  </script>

</body>

</html>
