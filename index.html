<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR NFT – Van Gogh Journey</title>

  <!-- A-Frame (pinned for AR.js compatibility) -->
  <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
  <!-- AR.js (pinned release with NFT support) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    #message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 8px;
      font-size: 18px;
      display: none;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <div id="message"></div>

  <!-- Start camera button (user gesture required by some mobile browsers) -->
  <button id="start-camera"
    style="position:fixed;right:12px;top:12px;z-index:9999;padding:10px 14px;background:#1e88e5;color:#fff;border:none;border-radius:6px;font-size:16px">Start
    Camera</button>

  <!-- Debug: toggle models visibility for testing without markers -->
  <button id="toggle-models"
    style="position:fixed;right:12px;top:58px;z-index:9999;padding:8px 12px;background:#4caf50;color:#fff;border:none;border-radius:6px;font-size:14px">Toggle
    Models</button>

  <a-scene vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;" embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true; sourceWidth: 1280; sourceHeight: 720; canvasWidth: 1280; canvasHeight: 720;">

    <!-- --- 1. NFT #1 — Van Gogh portrait --- -->
    <a-nft id="vangogh-marker" type="nft" url="./vangogh" smooth="true" smoothCount="10" smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity id="vincentModel" gltf-model="./vincent.gltf" scale="1 1 1" position="0 0 0" rotation="0 0 0"
        visible="false">
      </a-entity>

    </a-nft>


    <!-- --- 2. NFT #2 — Starry Night --- -->
    <a-nft id="starry-marker" type="nft" url="./starrynight" smooth="true" smoothCount="10" smoothTolerance="0.01"
      smoothThreshold="5">

      <a-entity id="starryScene" gltf-model="./scene.gltf" scale="1 1 1" position="0 0 0" rotation="0 0 0"
        visible="false">
      </a-entity>

    </a-nft>


    <a-entity camera></a-entity>
  </a-scene>


  <script>
    // ------------------------------
    // STATE VARIABLES
    // ------------------------------
    let hasScannedVangogh = false;

    // ------------------------------
    // UTILITY: show message
    // ------------------------------
    function showMessage(text, duration = 2000) {
      const msg = document.getElementById("message");
      msg.innerHTML = text;
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", duration);
    }

    // ------------------------------
    // NFT #1 — Van Gogh logic
    // ------------------------------
    document.querySelector("#vangogh-marker").addEventListener("markerFound", () => {
      console.log('markerFound: vangogh-marker');
      hasScannedVangogh = true;

      const vincent = document.querySelector("#vincentModel");
      vincent.setAttribute("visible", true);

      showMessage("You met the artist. The painting is now unlocked.");
    });

    document.querySelector("#vangogh-marker").addEventListener("markerLost", () => {
      console.log('markerLost: vangogh-marker');
      document.querySelector("#vincentModel").setAttribute("visible", false);
    });


    // ------------------------------
    // NFT #2 — Starry Night logic
    // ------------------------------
    document.querySelector("#starry-marker").addEventListener("markerFound", () => {
      console.log('markerFound: starry-marker');
      if (!hasScannedVangogh) {
        // Block the Starry Night until portrait is scanned
        showMessage("Meet the artist first.");
        return;
      }

      const starry = document.querySelector("#starryScene");
      starry.setAttribute("visible", true);

      showMessage("Welcome to Starry Night.");
    });

    document.querySelector("#starry-marker").addEventListener("markerLost", () => {
      console.log('markerLost: starry-marker');
      document.querySelector("#starryScene").setAttribute("visible", false);
    });

    // ------------------------------
    // MODEL LOAD DIAGNOSTICS
    // ------------------------------
    const vincent = document.querySelector('#vincentModel');
    const starry = document.querySelector('#starryScene');
    if (vincent && vincent.addEventListener) {
      vincent.addEventListener('model-loaded', (e) => { console.log('vincent model-loaded', e); });
      vincent.addEventListener('error', (e) => { console.warn('vincent model error', e); showMessage('Error loading Vincent model.'); });
    }
    if (starry && starry.addEventListener) {
      starry.addEventListener('model-loaded', (e) => { console.log('starry model-loaded', e); });
      starry.addEventListener('error', (e) => { console.warn('starry model error', e); showMessage('Error loading Starry model.'); });
    }

    // ------------------------------
    // USER-GESTURE CAMERA START (some browsers require user action)
    // ------------------------------
    const startBtn = document.getElementById('start-camera');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showMessage('Camera not supported in this browser.');
          return;
        }

        showMessage('Requesting camera permission...');
        const constraints = { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } };
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            // Stop the probe tracks — AR.js will create its own stream. This call just triggers permission.
            stream.getTracks().forEach(t => t.stop());
            showMessage('Camera permission granted. AR should start.');
            startBtn.style.display = 'none';
            console.log('Camera permission granted via user gesture');
          })
          .catch(err => {
            console.warn('getUserMedia error', err);
            let msg = 'Camera permission denied or not available';
            if (err && err.name) msg += ' (' + err.name + ')';
            msg += '. Use Chrome on Android or HTTPS on iOS.';
            showMessage(msg, 5000);
          });
      });
    }
  </script>

  <script>
    // Debug helper: toggle models to verify rendering without markers
    const toggleBtn = document.getElementById('toggle-models');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const v = document.getElementById('vincentModel');
        const s = document.getElementById('starryScene');
        if (!v || !s) return;
        const newVis = v.getAttribute('visible') !== 'true';
        v.setAttribute('visible', newVis);
        s.setAttribute('visible', newVis);
        console.log('Debug: toggled model visibility ->', newVis);
      });
    }

    // Log configured AR.js sizes for debugging
    window.addEventListener('load', () => {
      const scene = document.querySelector('a-scene');
      if (scene && scene.getAttribute('arjs')) {
        console.log('AR.js config:', scene.getAttribute('arjs'));
      }
    });
  </script>

</body>

</html>
