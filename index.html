<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Little Prince AR Story – Text Panels</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3em;
    }

    #ar-ui {
      position: fixed;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 2000;
      pointer-events: none;
      font-family: Arial;
    }

    #status-text-html {
      background: rgba(255, 255, 0, 0.9);
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    #interaction-text-html {
      background: rgba(0, 255, 0, 0.9);
      padding: 8px 16px;
      border-radius: 8px;
      display: inline-block;
      font-size: 16px;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">

  <!-- UI Overlay -->
  <div id="ar-ui">
    <div id="status-text-html">Scan the first page…</div><br>
    <div id="interaction-text-html">Little Prince Story AR</div>
  </div>

  <!-- Loader -->
  <div class="arjs-loader">Loading markers…</div>

  <!-- AR Scene -->
  <a-scene renderer="logarithmicDepthBuffer: true;" embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- PAGE 1 — Must be scanned first -->
    <a-nft id="page1" type="nft" url="./markers/little_prince_page1" smooth="true" smoothCount="20"
      smoothTolerance="0.5">

      <!-- BACK PANEL -->
      <a-plane position="0 0 -100" width="200" height="120" color="#FFF0B3" opacity="0.9"></a-plane>

      <!-- TEXT PANEL -->
      <a-text id="page1-text"
        value="The Little Prince – Page 1\n\nOnce upon a time, in the desert, a pilot met a mysterious young boy..."
        color="#000" width="180" align="center" position="0 0 -99">
      </a-text>
    </a-nft>

    <!-- PAGE 2 — LOCKED UNTIL PAGE 1 FOUND -->
    <a-nft id="page2" type="nft" url="./markers/little_prince_page2" visible="false" smooth="true" smoothCount="20"
      smoothTolerance="0.5">

      <!-- BACK PANEL -->
      <a-plane position="0 0 -100" width="200" height="120" color="#FFE6E6" opacity="0.9"></a-plane>

      <!-- TEXT PANEL -->
      <a-text id="page2-text"
        value="The Little Prince – Page 2\n\nThe little prince spoke of his tiny home planet, the sunsets, and the rose he left behind."
        color="#000" width="180" align="center" position="0 0 -99">
      </a-text>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let page1Scanned = false;
    const page2 = document.getElementById("page2");
    const statusText = document.getElementById("status-text-html");
    const interactionText = document.getElementById("interaction-text-html");

    // ===== PAGE 1 LOGIC =====
    document.getElementById("page1").addEventListener("markerFound", () => {
      page1Scanned = true;

      statusText.textContent = "Page 1 read! Now find Page 2.";
      interactionText.textContent = "You unlocked the next page.";

      // show page 2 marker
      page2.setAttribute("visible", "true");
    });

    // ===== PAGE 2 LOGIC =====
    document.getElementById("page2").addEventListener("markerFound", () => {
      if (!page1Scanned) {
        statusText.textContent = "You must read Page 1 first!";
        interactionText.textContent = "Find the first marker.";
        return;
      }

      statusText.textContent = "Page 2!";
      interactionText.textContent = "Great job!";
    });
  </script>

</body>

</html>
