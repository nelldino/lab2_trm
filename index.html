<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR NFT – Van Gogh & Starry Night</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js NFT build -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene vr-mode-ui="enabled: false" embedded renderer="antialias: true; alpha: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- ================
       MARKER 1 – STARRY NIGHT
       ================ -->
    <a-nft id="marker-starry" type="nft" url="./markers/starrynight" smooth="true" smoothCount="10"
      smoothTolerance="0.01" smoothThreshold="5">
      <!-- Starry Night 3D model -->
      <a-entity id="model-starry" gltf-model="./models/starry.gltf" position="0 0 0" rotation="0 180 0"
        scale="1.6 1.6 1.6"></a-entity>
    </a-nft>

    <!-- ================
       MARKER 2 – VAN GOGH
       ================ -->
    <a-nft id="marker-vangogh" type="nft" url="./markers/vangogh" smooth="true" smoothCount="10" smoothTolerance="0.01"
      smoothThreshold="5">
      <!-- Van Gogh 3D model -->
      <a-entity id="model-vangogh" gltf-model="./models/vangogh.gltf" position="0 0 0" rotation="0 180 0"
        scale="1.6 1.6 1.6"></a-entity>
    </a-nft>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
