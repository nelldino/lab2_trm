<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR NFT: Vangogh & StarryNight</title>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- AR.js with NFT support for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene vr-mode-ui="enabled: false" embedded renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <!-- GLTF models placed in project root -->
      <a-asset-item id="vincent-gltf" src="vincent.gltf"></a-asset-item>
      <a-asset-item id="scene-gltf" src="scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Light for models -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0 1 0"></a-entity>

    <!-- NFT marker for Vincent (vangogh) -->
    <a-nft id="nft-vincent" type="nft" url="./vangogh" smooth="true">
      <a-entity id="model-vincent" gltf-model="#vincent-gltf" scale="0.5 0.5 0.5" visible="false"></a-entity>
    </a-nft>

    <!-- NFT marker for Starry Night (starrynight) -->
    <a-nft id="nft-starry" type="nft" url="./starrynight" smooth="true">
      <a-entity id="model-starry" gltf-model="#scene-gltf" scale="0.5 0.5 0.5" visible="false"></a-entity>
    </a-nft>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <div id="ui"
    style="position:fixed;left:8px;top:8px;z-index:999;color:#fff;font-family:Arial,Helvetica,sans-serif;text-shadow:0 0 6px #000">
    <div id="status">Scan the Vangogh NFT to start.</div>
  </div>

  <script>
    (function () {
      const status = document.getElementById('status');
      const nftVincent = document.getElementById('nft-vincent');
      const nftStarry = document.getElementById('nft-starry');
      const modelVincent = document.getElementById('model-vincent');
      const modelStarry = document.getElementById('model-starry');

      // Rule: starry cannot appear until vangogh has been scanned at least once
      let scannedVincent = false;

      function showMessage(text) {
        status.textContent = text;
      }

      // Helper to show only one model at a time
      function showOnly(modelToShow) {
        if (modelToShow === 'vincent') {
          modelVincent.setAttribute('visible', 'true');
          modelStarry.setAttribute('visible', 'false');
        } else if (modelToShow === 'starry') {
          modelStarry.setAttribute('visible', 'true');
          modelVincent.setAttribute('visible', 'false');
        }
      }

      // Vincent marker events
      nftVincent.addEventListener('markerFound', () => {
        scannedVincent = true;
        showOnly('vincent');
        showMessage('Vangogh scanned — you can now scan Starry Night.');
      });

      nftVincent.addEventListener('markerLost', () => {
        // when lost, hide the model
        modelVincent.setAttribute('visible', 'false');
        showMessage('Vangogh marker lost.');
      });

      // Starry marker events
      nftStarry.addEventListener('markerFound', () => {
        if (!scannedVincent) {
          // refuse to show starry until vincent scanned
          showMessage('Scan Vangogh first before Starry Night.');
          // ensure starry remains hidden
          modelStarry.setAttribute('visible', 'false');
          return;
        }
        // allow switch: show starry and hide vincent
        showOnly('starry');
        showMessage('Starry Night scanned — showing Starry Night model.');
      });

      nftStarry.addEventListener('markerLost', () => {
        modelStarry.setAttribute('visible', 'false');
        showMessage('Starry Night marker lost.');
      });

      // Safety: if both markers present, prefer the one that fired most recently
      // The event handlers above already toggle visibility so only one is visible.

    })();
  </script>
</body>

</html>
