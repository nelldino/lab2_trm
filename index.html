<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR NFT – Van Gogh Journey (Debug)</title>

  <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border-radius: 8px;
      font-size: 18px;
      display: none;
      z-index: 10000;
    }

    #debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      max-width: 300px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 9998;
    }

    .button {
      position: fixed;
      right: 12px;
      z-index: 9999;
      padding: 10px 14px;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    #start-camera {
      top: 12px;
      background: #1e88e5;
    }

    #toggle-models {
      top: 58px;
      background: #4caf50;
    }

    #test-models {
      top: 104px;
      background: #ff9800;
    }

    #create-test-box {
      top: 150px;
      background: #e91e63;
    }

    #force-show-models {
      top: 196px;
      background: #9c27b0;
    }
  </style>
</head>

<body>
  <div id="message"></div>
  <div id="debug-panel"></div>

  <button id="start-camera" class="button">Start Camera</button>
  <button id="toggle-models" class="button">Toggle Models</button>
  <button id="test-models" class="button">Test Models</button>
  <button id="create-test-box" class="button">Create Test Box</button>
  <button id="force-show-models" class="button">Force Show Models</button>

  <a-scene vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;" embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true; sourceWidth: 1280; sourceHeight: 720; canvasWidth: 1280; canvasHeight: 720;">

    <!-- VAN GOGH NFT -->
    <a-nft id="vangogh-marker" type="nft" url="./vangogh" smooth="true" smoothCount="10" smoothTolerance="0.01"
      smoothThreshold="5">

      <a-box id="vincentFallback" color="#4CC3D9" depth="0.5" height="1" width="0.5" position="0 0.5 0"
        visible="false"></a-box>

      <a-entity id="vincentModel" gltf-model="./vincent.gltf" scale="3 3 3" position="0 0.4 0" rotation="0 0 0"
        visible="false"></a-entity>
    </a-nft>

    <!-- STARRY NIGHT NFT -->
    <a-nft id="starry-marker" type="nft" url="./starrynight" smooth="true" smoothCount="10" smoothTolerance="0.01"
      smoothThreshold="5">

      <a-box id="starryFallback" color="#EF2D5E" depth="0.5" height="1" width="0.5" position="0 0.5 0"
        visible="false"></a-box>

      <a-entity id="starryScene" gltf-model="./scene.gltf" scale="3 3 3" position="0 0.4 0" rotation="0 0 0"
        visible="false"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const debugPanel = document.getElementById('debug-panel');
    function debugLog(msg) {
      console.log(msg);
      const time = new Date().toLocaleTimeString();
      debugPanel.innerHTML += `[${time}] ${msg}<br>`;
      debugPanel.scrollTop = debugPanel.scrollHeight;
    }

    let hasScannedVangogh = false;
    let vincentLoaded = false;
    let starryLoaded = false;

    function showMessage(text, duration = 2000) {
      const msg = document.getElementById("message");
      msg.innerHTML = text;
      msg.style.display = "block";
      setTimeout(() => msg.style.display = "none", duration);
    }

    /* --------------------
       FILE CHECK
    -------------------- */
    async function checkFiles() {
      debugLog('Checking model files...');
      const files = [
        './vincent.gltf',
        './scene.gltf',
        './vangogh.fset',
        './vangogh.fset3',
        './vangogh.iset',
        './starrynight.fset',
        './starrynight.fset3',
        './starrynight.iset'
      ];

      for (const file of files) {
        try {
          const response = await fetch(file, { method: 'HEAD' });
          debugLog(`${file}: ${response.ok ? '✓ OK' : '✗ NOT FOUND'}`);
        } catch {
          debugLog(`${file}: ERROR`);
        }
      }
    }

    /* --------------------
       MARKER EVENTS
    -------------------- */
    const vangoghMarker = document.querySelector("#vangogh-marker");
    const starryMarker = document.querySelector("#starry-marker");

    vangoghMarker.addEventListener("markerFound", () => {
      debugLog('✓ Van Gogh marker found');
      hasScannedVangogh = true;

      const vincent = document.querySelector("#vincentModel");
      const fallback = document.querySelector("#vincentFallback");

      if (vincentLoaded) {
        vincent.setAttribute("visible", true);
      } else {
        fallback.setAttribute("visible", true);
      }

      showMessage("You met the artist. The painting is now unlocked.");
    });

    vangoghMarker.addEventListener("markerLost", () => {
      debugLog('Van Gogh marker lost');
      document.querySelector("#vincentModel").setAttribute("visible", false);
      document.querySelector("#vincentFallback").setAttribute("visible", false);
    });

    starryMarker.addEventListener("markerFound", () => {
      debugLog('✓ Starry Night marker found');

      if (!hasScannedVangogh) {
        showMessage("Meet the artist first.");
        return;
      }

      const starry = document.querySelector("#starryScene");
      const fallback = document.querySelector("#starryFallback");

      if (starryLoaded) {
        starry.setAttribute("visible", true);
      } else {
        fallback.setAttribute("visible", true);
      }

      showMessage("Welcome to Starry Night.");
    });

    starryMarker.addEventListener("markerLost", () => {
      debugLog('Starry Night marker lost');
      document.querySelector("#starryScene").setAttribute("visible", false);
      document.querySelector("#starryFallback").setAttribute("visible", false);
    });

    /* --------------------
       MODEL LOADING
    -------------------- */
    const vincent = document.querySelector('#vincentModel');
    const starry = document.querySelector('#starryScene');

    vincent.addEventListener('model-loaded', () => {
      vincentLoaded = true;
      debugLog('✓ Vincent model loaded');
    });

    starry.addEventListener('model-loaded', () => {
      starryLoaded = true;
      debugLog('✓ Starry model loaded');
    });

    /* --------------------
       CAMERA START BUTTON
    -------------------- */
    document.getElementById('start-camera').addEventListener('click', () => {
      debugLog('Requesting camera...');
      showMessage('Requesting camera permission...');

      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          stream.getTracks().forEach(t => t.stop());
          showMessage("Camera ready");
          document.getElementById('start-camera').style.display = 'none';
        })
        .catch(() => {
          showMessage("Camera permission denied", 4000);
        });
    });

    /* --------------------
       TOGGLE MODELS
    -------------------- */
    document.getElementById('toggle-models').addEventListener('click', () => {
      let v = document.getElementById('vincentModel');
      let s = document.getElementById('starryScene');
      let vf = document.getElementById('vincentFallback');
      let sf = document.getElementById('starryFallback');

      let newVis = v.getAttribute('visible') !== 'true';

      v.setAttribute('visible', newVis);
      s.setAttribute('visible', newVis);
      vf.setAttribute('visible', newVis);
      sf.setAttribute('visible', newVis);

      debugLog(`Models set visible: ${newVis}`);
    });

    /* --------------------
       TEST MODELS
    -------------------- */
    document.getElementById('test-models').addEventListener('click', () => {
      debugLog("Forcing models in front of camera...");

      const v = document.getElementById("vincentModel");
      const s = document.getElementById("starryScene");

      v.object3D.position.set(0, 0, -2);
      v.setAttribute("visible", true);

      s.object3D.position.set(0, 0, -2);
      s.setAttribute("visible", true);

      showMessage("Models placed in front of camera");
    });

    /* --------------------
       CREATE A TEST BOX
    -------------------- */
    document.getElementById('create-test-box').addEventListener('click', () => {
      debugLog("Creating test box...");

      const scene = document.querySelector("a-scene");

      const testBox = document.createElement("a-box");
      testBox.setAttribute("color", "#FF00FF");
      testBox.setAttribute("width", "0.5");
      testBox.setAttribute("height", "0.5");
      testBox.setAttribute("depth", "0.5");
      testBox.setAttribute("position", "0 0 -2");

      scene.appendChild(testBox);

      showMessage("Pink box created");
    });

    /* --------------------
       FORCE SHOW FALLBACK
    -------------------- */
    document.getElementById('force-show-models').addEventListener('click', () => {
      debugLog("Showing fallback boxes...");

      const vf = document.getElementById("vincentFallback");
      const sf = document.getElementById("starryFallback");

      vf.setAttribute("position", "0 0 -2");
      vf.setAttribute("visible", true);

      sf.setAttribute("position", "0 0 -2");
      sf.setAttribute("visible", true);

      showMessage("Fallback boxes visible");
    });
  </script>
</body>

</html>
