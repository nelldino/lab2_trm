<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR NFT – Van Gogh & Starry Night</title>

  <!-- A-Frame 1.4.x -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.4.2/dist/aframe.min.js"></script>
  <!-- AR.js NFT build -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .arjs-loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <div class="arjs-loader" id="loader">Loading AR NFT markers & models…</div>

  <a-scene embedded arjs="trackingMethod: best; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="vincent-model" src="/models/vincent.gltf"></a-asset-item>
      <a-asset-item id="starry-model" src="/models/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Vincent marker -->
    <a-nft id="marker-vincent" type="nft" url="markers/vincent">
      <a-entity id="model-vincent" gltf-model="#vincent-model" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0"
        visible="false"></a-entity>
    </a-nft>

    <!-- Starry Night marker -->
    <a-nft id="marker-starry" type="nft" url="markers/starrynight">
      <a-entity id="model-starry" gltf-model="#starry-model" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0"
        visible="false"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');

    const markers = [
      { id: 'marker-vincent', model: 'model-vincent' },
      { id: 'marker-starry', model: 'model-starry' }
    ];

    markers.forEach(({ id, model }) => {
      const markerEl = document.getElementById(id);
      const modelEl = document.getElementById(model);

      markerEl.addEventListener('markerFound', () => {
        console.log(`${id} found`);
        modelEl.setAttribute('visible', 'true');
        loader.style.display = 'none';
      });

      markerEl.addEventListener('markerLost', () => {
        console.log(`${id} lost`);
        modelEl.setAttribute('visible', 'false');
      });
    });

    // Fallback: hide loader after 10s in case video event doesn't fire
    setTimeout(() => {
      loader.style.display = 'none';
    }, 10000);

    // Optional: hide loader when AR.js video is ready
    window.addEventListener('arjs-video-loaded', () => {
      loader.style.display = 'none';
    });
  </script>

</body>

</html>
